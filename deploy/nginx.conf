# Site nginx de l'hôte : HTTPS + proxy vers le conteneur (127.0.0.1:8000).
# Reprend le certificat Let's Encrypt déjà émis pour botouraineplongee.ddns.net (ancien site helloasso).
server {
    listen 80;
    server_name botouraineplongee.ddns.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name botouraineplongee.ddns.net;

    ssl_certificate /etc/letsencrypt/live/botouraineplongee.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botouraineplongee.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
