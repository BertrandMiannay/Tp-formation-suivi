{# Contenu d'une note côté encadrants : partie visible par l'élève puis note équipe. #}
{% if note.content %}<p style="white-space:pre-line; margin-top:0.4rem;">{{ note.content }}</p>{% endif %}
{% if note.staff_content %}<p class="staff-note" style="white-space:pre-line; margin-top:0.4rem; font-size:inherit;"><span class="private-mark" title="Note réservée à l'équipe encadrante">🔒</span> {{ note.staff_content }}</p>{% endif %}
