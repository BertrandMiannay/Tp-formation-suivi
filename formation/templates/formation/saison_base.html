{% extends "base.html" %}

{% block content %}
<div style="display:flex; gap:0; margin-bottom:1.5rem; border-bottom:2px solid #1a1a2e; overflow-x:auto;">
    <a href="{% url 'saison-gestion' %}"
       style="padding:0.5rem 1.25rem; text-decoration:none; font-size:0.95rem;
              {% if active_tab == 'gestion' %}background:#1a1a2e; color:white;{% else %}color:#1a1a2e;{% endif %}">
        Saisons
    </a>
    <a href="{% url 'saison-cursus' %}"
       style="padding:0.5rem 1.25rem; text-decoration:none; font-size:0.95rem;
              {% if active_tab == 'cursus' or active_tab == 'importer' %}background:#1a1a2e; color:white;{% else %}color:#1a1a2e;{% endif %}">
        Cursus
    </a>
</div>

{% block saison_content %}{% endblock %}
{% endblock %}
