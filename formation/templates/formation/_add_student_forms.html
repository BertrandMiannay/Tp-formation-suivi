{# Ajout d'un élève existant (_action = existing_action) ou création rapide (_action = create_student). #}
{% if addable_members %}
<form method="post" style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem;">
    {% csrf_token %}
    <input type="hidden" name="_action" value="{{ existing_action }}">
    <label style="margin:0;">Élève existant :</label>
    <select name="member_id" style="width:auto; flex:1; min-width:200px;">
        {% for m in addable_members %}<option value="{{ m.pk }}">{{ m.last_name }} {{ m.first_name }}</option>{% endfor %}
    </select>
    <button type="submit" class="btn btn-secondary">{{ existing_label }}</button>
</form>
{% endif %}
<form method="post" style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
    {% csrf_token %}
    <input type="hidden" name="_action" value="create_student">
    <label style="margin:0;">Nouvel élève :</label>
    <input type="text" name="first_name" placeholder="Prénom *" required value="{{ quick_form.first_name.value|default:'' }}" style="width:auto; flex:1; min-width:120px;">
    <input type="text" name="last_name" placeholder="Nom *" required value="{{ quick_form.last_name.value|default:'' }}" style="width:auto; flex:1; min-width:120px;">
    {% if formations %}
    <select name="formation_id" style="width:auto;" aria-label="Formation">
        {% for f in formations %}<option value="{{ f.pk }}">{{ f.name }}</option>{% endfor %}
        <option value="">Sans inscription</option>
    </select>
    {% endif %}
    <button type="submit" class="btn btn-secondary">{{ create_label }}</button>
</form>
